name: sysfinan

services:
  app:
    build:
      context: .
      dockerfile: php/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: >-
      sh -c "composer install --no-interaction --prefer-dist && php-fpm"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sysfinan}
      DB_USERNAME: ${DB_USERNAME:-sysfinan}
      DB_PASSWORD: ${DB_PASSWORD:-sysfinan}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - ./src:/var/www/html
      - composer-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sysfinan
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - sysfinan
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sysfinan}
      POSTGRES_USER: ${DB_USERNAME:-sysfinan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sysfinan}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sysfinan
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: >-
      sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./src:/var/www/html
      - node-modules:/var/www/html/node_modules
    networks:
      - sysfinan
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - sysfinan
    restart: unless-stopped

networks:
  sysfinan:
    driver: bridge

volumes:
  composer-vendor:
  node-modules:
  postgres-data:
